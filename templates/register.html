<!DOCTYPE html>
<html lang="id" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>Daftar Owner Baru - GoJadwal</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="h-full bg-slate-100 text-slate-900 font-sans antialiased flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-white rounded-3xl border-2 border-emerald-500 shadow-2xl overflow-hidden">
        
        <!-- HEADER FORM -->
        <div class="bg-emerald-700 text-white p-6 text-center border-b-2 border-emerald-800">
            <div class="inline-flex bg-white text-emerald-700 p-3 rounded-2xl shadow-md mb-3">
                <i class="fa-solid fa-user-plus text-2xl" aria-hidden="true"></i>
            </div>
            <h1 class="text-2xl font-black">Buat Akun Owner</h1>
            <p class="text-xs text-emerald-100 font-medium mt-1">Daftar untuk membuat halaman kalender booking publik kamu</p>
        </div>

        <!-- FORM BODY -->
        <div class="p-6 space-y-4">

            <!-- ALERT NOTIFIKASI -->
            <div id="alertBox" class="hidden p-3.5 rounded-2xl border-2 text-xs font-bold items-center gap-2" role="alert">
                <i id="alertIcon" class="fa-solid" aria-hidden="true"></i>
                <span id="alertMessage"></span>
            </div>

            <!-- FORM REGISTER -->
            <form id="registerForm" class="space-y-4" novalidate>
                <div>
                    <label for="username" class="block text-xs font-bold text-slate-700 uppercase mb-1">Username</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
                            <i class="fa-solid fa-at text-sm" aria-hidden="true"></i>
                        </span>
                        <input type="text" id="username" name="username" required autocomplete="username" placeholder="contoh: joko" pattern="[a-zA-Z0-9_]+" title="Hanya huruf, angka, dan underscore (_)"
                            class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border-2 border-slate-300 rounded-xl text-sm font-bold text-slate-900 focus:border-emerald-600 focus:bg-white outline-none transition">
                    </div>
                    <p class="text-[10px] text-slate-500 font-bold mt-1">Username ini akan menjadi link kamu: <span class="text-emerald-700">gojadwal.com/username</span></p>
                </div>

                <div>
                    <label for="password" class="block text-xs font-bold text-slate-700 uppercase mb-1">Password</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
                            <i class="fa-solid fa-lock text-sm" aria-hidden="true"></i>
                        </span>
                        <input type="password" id="password" name="password" required minlength="6" autocomplete="new-password" placeholder="Minimal 6 karakter" 
                            class="w-full pl-10 pr-11 py-2.5 bg-slate-50 border-2 border-slate-300 rounded-xl text-sm font-bold text-slate-900 focus:border-emerald-600 focus:bg-white outline-none transition">
                        
                        <!-- Toggle Lihat Password -->
                        <button type="button" id="togglePasswordBtn" title="Tampilkan/Sembunyikan Password"
                            class="absolute inset-y-0 right-0 flex items-center pr-3.5 text-slate-400 hover:text-emerald-700 transition cursor-pointer">
                            <i id="togglePasswordIcon" class="fa-solid fa-eye text-sm" aria-hidden="true"></i>
                        </button>
                    </div>
                </div>

                <!-- SUBMIT BUTTON (BEBAS INNERHTML) -->
                <button type="submit" id="submitBtn" 
                    class="w-full py-3 bg-emerald-700 hover:bg-emerald-800 disabled:opacity-70 disabled:cursor-not-allowed text-white font-black text-sm rounded-xl shadow-md transition transform active:scale-95 flex items-center justify-center gap-2">
                    <i id="btnIconReg" class="fa-solid fa-user-check" aria-hidden="true"></i>
                    <i id="btnIconSpinner" class="fa-solid fa-spinner animate-spin hidden" aria-hidden="true"></i>
                    <span id="btnText">Daftar Akun</span>
                </button>
            </form>

            <div class="pt-4 border-t-2 border-slate-100 text-center text-xs font-bold text-slate-600">
                Sudah punya akun? 
                <a href="/login" class="text-emerald-700 hover:underline font-black">Login di sini</a>
            </div>

            <div class="text-center">
                <a href="/" class="text-xs font-extrabold text-slate-700 hover:text-slate-600 transition">
                    <i class="fa-solid fa-arrow-left mr-1" aria-hidden="true"></i> Kembali ke Halaman Utama
                </a>
            </div>

        </div>
    </div>

    <script>
    document.addEventListener("DOMContentLoaded", () => {
        const registerForm = document.getElementById("registerForm");
        if (registerForm) {
            registerForm.addEventListener("submit", handleRegister);
        }

        // Event listener toggle lihat password
        const togglePasswordBtn = document.getElementById("togglePasswordBtn");
        if (togglePasswordBtn) {
            togglePasswordBtn.addEventListener("click", togglePasswordVisibility);
        }
    });

    // FUNGSI TOGGLE LIHAT PASSWORD (AMAN TANPA INNERHTML)
    function togglePasswordVisibility() {
        const passwordInput = document.getElementById("password");
        const toggleIcon = document.getElementById("togglePasswordIcon");

        if (!passwordInput || !toggleIcon) return;

        if (passwordInput.type === "password") {
            passwordInput.type = "text";
            toggleIcon.classList.remove("fa-eye");
            toggleIcon.classList.add("fa-eye-slash");
        } else {
            passwordInput.type = "password";
            toggleIcon.classList.remove("fa-eye-slash");
            toggleIcon.classList.add("fa-eye");
        }
    }

    // FUNGSI FETCH RETRY UNTUK JARINGAN/SERVER ERROR 5XX
    async function fetchWithRetry(url, options = {}, retries = 3, delay = 1000) {
        try {
            const response = await fetch(url, options);
            
            if (!response.ok && response.status >= 500 && retries > 0) {
                await new Promise(resolve => setTimeout(resolve, delay));
                return fetchWithRetry(url, options, retries - 1, delay * 2);
            }
            
            return response;
        } catch (err) {
            if (retries > 0) {
                await new Promise(resolve => setTimeout(resolve, delay));
                return fetchWithRetry(url, options, retries - 1, delay * 2);
            }
            throw err;
        }
    }

    async function handleRegister(e) {
        e.preventDefault();
        showAlert(false);

        const submitBtn = document.getElementById("submitBtn");
        const btnIconReg = document.getElementById("btnIconReg");
        const btnIconSpinner = document.getElementById("btnIconSpinner");
        const btnText = document.getElementById("btnText");

        const usernameInput = document.getElementById("username").value.trim();
        const passwordInput = document.getElementById("password").value;

        // Validasi Sisi Frontend
        if (!/^[a-zA-Z0-9_]+$/.test(usernameInput)) {
            showAlert(true, "Username hanya boleh berisi huruf, angka, dan underscore (_)", "error");
            return;
        }

        if (passwordInput.length < 6) {
            showAlert(true, "Password minimal 6 karakter.", "error");
            return;
        }

        // Set state loading tanpa innerHTML
        submitBtn.disabled = true;
        btnIconReg.classList.add("hidden");
        btnIconSpinner.classList.remove("hidden");
        btnText.textContent = "Memproses...";

        try {
            const response = await fetchWithRetry("/regis", {
                method: "POST",
                headers: { 
                    "Content-Type": "application/json",
                    "X-Requested-With": "XMLHttpRequest"
                },
                body: JSON.stringify({ username: usernameInput, password: passwordInput })
            }, 3, 800);

            const contentType = response.headers.get("content-type");
            let data = {};
            if (contentType && contentType.includes("application/json")) {
                data = await response.json().catch(() => ({}));
            }

            if (response.ok) {
                showAlert(true, "Pendaftaran berhasil! Mengalihkan ke halaman login...", "success");
                setTimeout(() => {
                    window.location.href = "/login";
                }, 1500);
            } else {
                const errorMsg = typeof data.error === "string" ? data.error : (data.err || "Gagal mendaftar, username mungkin sudah digunakan.");
                showAlert(true, errorMsg, "error");
            }
        } catch (err) {
            showAlert(true, "Gagal terhubung ke server. Periksa koneksi Anda.", "error");
        } finally {
            resetButtonState(submitBtn, btnIconReg, btnIconSpinner, btnText);
        }
    }

    function resetButtonState(submitBtn, iconReg, iconSpinner, btnText) {
        submitBtn.disabled = false;
        iconSpinner.classList.add("hidden");
        iconReg.classList.remove("hidden");
        btnText.textContent = "Daftar Akun";
    }

    function showAlert(show, message = "", type = "error") {
        const box = document.getElementById("alertBox");
        const icon = document.getElementById("alertIcon");
        const msg = document.getElementById("alertMessage");

        if (!show) {
            box.classList.add("hidden");
            box.classList.remove("flex");
            return;
        }

        box.className = "p-3.5 rounded-2xl border-2 text-xs font-bold flex items-center gap-2 ";
        if (type === "success") {
            box.classList.add("bg-emerald-100", "border-emerald-400", "text-emerald-950");
            icon.className = "fa-solid fa-circle-check text-emerald-700 text-base";
        } else {
            box.classList.add("bg-rose-100", "border-rose-400", "text-rose-950");
            icon.className = "fa-solid fa-triangle-exclamation text-rose-600 text-base";
        }

        // AMAN DARI DOM-XSS: Gunakan textContent
        msg.textContent = message;
        box.classList.remove("hidden");
    }
</script>
</body>
</html>
