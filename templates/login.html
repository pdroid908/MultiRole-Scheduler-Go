<!DOCTYPE html>
<html lang="id" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>Login Owner - GoJadwal</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="h-full bg-slate-100 text-slate-900 font-sans antialiased flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-white rounded-3xl border-2 border-emerald-500 shadow-2xl overflow-hidden">
        
        <!-- HEADER FORM -->
        <div class="bg-emerald-700 text-white p-6 text-center border-b-2 border-emerald-800">
            <div class="inline-flex bg-white text-emerald-700 p-3 rounded-2xl shadow-md mb-3">
                <i class="fa-solid fa-calendar-days text-2xl" aria-hidden="true"></i>
            </div>
            <h1 class="text-2xl font-black">Login Owner</h1>
            <p class="text-xs text-emerald-100 font-medium mt-1">Masuk ke akun untuk mengelola jadwal booking</p>
        </div>

        <!-- FORM BODY -->
        <div class="p-6 space-y-4">

            <!-- ALERT NOTIFIKASI -->
            <div id="alertBox" class="hidden p-3.5 rounded-2xl border-2 text-xs font-bold items-center gap-2" role="alert">
                <i id="alertIcon" class="fa-solid" aria-hidden="true"></i>
                <span id="alertMessage"></span>
            </div>

            <!-- FORM LOGIN -->
            <form id="loginForm" class="space-y-4" novalidate>
                <div>
                    <label for="username" class="block text-xs font-bold text-slate-700 uppercase mb-1">Username</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
                            <i class="fa-solid fa-user text-sm" aria-hidden="true"></i>
                        </span>
                        <input type="text" id="username" name="username" required autocomplete="username" placeholder="Masukkan username" 
                            class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border-2 border-slate-300 rounded-xl text-sm font-bold text-slate-900 focus:border-emerald-600 focus:bg-white outline-none transition">
                    </div>
                </div>

                <div>
                    <label for="password" class="block text-xs font-bold text-slate-700 uppercase mb-1">Password</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
                            <i class="fa-solid fa-lock text-sm" aria-hidden="true"></i>
                        </span>
                        <!-- Input Password -->
                        <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="••••••••" 
                            class="w-full pl-10 pr-11 py-2.5 bg-slate-50 border-2 border-slate-300 rounded-xl text-sm font-bold text-slate-900 focus:border-emerald-600 focus:bg-white outline-none transition">
                        
                        <!-- Tombol Lihat / Sembunyikan Password -->
                        <button type="button" id="togglePasswordBtn" title="Tampilkan/Sembunyikan Password"
                            class="absolute inset-y-0 right-0 flex items-center pr-3.5 text-slate-400 hover:text-emerald-700 transition cursor-pointer">
                            <i id="togglePasswordIcon" class="fa-solid fa-eye text-sm" aria-hidden="true"></i>
                        </button>
                    </div>
                </div>

                <!-- BUTTON SUBMIT (AMAN TANPA INNERHTML) -->
                <button type="submit" id="submitBtn" 
                    class="w-full py-3 bg-emerald-700 hover:bg-emerald-800 disabled:opacity-70 disabled:cursor-not-allowed text-white font-black text-sm rounded-xl shadow-md transition transform active:scale-95 flex items-center justify-center gap-2">
                    <i id="btnIconLogin" class="fa-solid fa-right-to-bracket" aria-hidden="true"></i>
                    <i id="btnIconSpinner" class="fa-solid fa-spinner animate-spin hidden" aria-hidden="true"></i>
                    <span id="btnText">Masuk</span>
                </button>
            </form>

            <div class="pt-4 border-t-2 border-slate-100 text-center text-xs font-bold text-slate-600">
                Belum punya akun? 
                <a href="/register" class="text-emerald-700 hover:underline font-black">Daftar sekarang</a>
            </div>

            <div class="text-center">
                <a href="/" class="text-xs font-extrabold text-slate-700 hover:text-slate-600 transition">
                    <i class="fa-solid fa-arrow-left mr-1" aria-hidden="true"></i> Kembali ke Halaman Utama
                </a>
            </div>

        </div>
    </div>

    <script>
    document.addEventListener("DOMContentLoaded", () => {
        const loginForm = document.getElementById("loginForm");
        if (loginForm) {
            loginForm.addEventListener("submit", handleLogin);
        }

        // EVENT LISTENER TOGGLE LIHAT PASSWORD
        const togglePasswordBtn = document.getElementById("togglePasswordBtn");
        if (togglePasswordBtn) {
            togglePasswordBtn.addEventListener("click", togglePasswordVisibility);
        }
    });

    // FUNGSI TOGGLE LIHAT / SEMBUNYIKAN PASSWORD (AMAN TANPA INNERHTML)
    function togglePasswordVisibility() {
        const passwordInput = document.getElementById("password");
        const toggleIcon = document.getElementById("togglePasswordIcon");

        if (!passwordInput || !toggleIcon) return;

        if (passwordInput.type === "password") {
            passwordInput.type = "text";
            toggleIcon.classList.remove("fa-eye");
            toggleIcon.classList.add("fa-eye-slash");
        } else {
            passwordInput.type = "password";
            toggleIcon.classList.remove("fa-eye-slash");
            toggleIcon.classList.add("fa-eye");
        }
    }

    // FUNGSI FETCH KHUSUS RETRY
    async function fetchWithRetry(url, options = {}, retries = 3, delay = 1000) {
        try {
            const response = await fetch(url, options);
            
            if (!response.ok && response.status >= 500 && retries > 0) {
                await new Promise(resolve => setTimeout(resolve, delay));
                return fetchWithRetry(url, options, retries - 1, delay * 2);
            }
            
            return response;
        } catch (err) {
            if (retries > 0) {
                await new Promise(resolve => setTimeout(resolve, delay));
                return fetchWithRetry(url, options, retries - 1, delay * 2);
            }
            throw err;
        }
    }

    async function handleLogin(e) {
        e.preventDefault();
        showAlert(false);

        const submitBtn = document.getElementById("submitBtn");
        const btnIconLogin = document.getElementById("btnIconLogin");
        const btnIconSpinner = document.getElementById("btnIconSpinner");
        const btnText = document.getElementById("btnText");

        // SET LOADING STATE
        submitBtn.disabled = true;
        btnIconLogin.classList.add("hidden");
        btnIconSpinner.classList.remove("hidden");
        btnText.textContent = "Memproses...";

        const usernameInput = document.getElementById("username");
        const passwordInput = document.getElementById("password");

        const username = usernameInput.value.trim();
        const password = passwordInput.value;

        if (!username || !password) {
            showAlert(true, "Harap isi semua kolom.", "error");
            resetButtonState(submitBtn, btnIconLogin, btnIconSpinner, btnText);
            return;
        }

        try {
            const response = await fetchWithRetry("/login", {
                method: "POST",
                headers: { 
                    "Content-Type": "application/json",
                    "X-Requested-With": "XMLHttpRequest"
                },
                body: JSON.stringify({ username, password })
            }, 3, 800);

            const data = await response.json().catch(() => ({}));

            if (response.ok) {
                showAlert(true, "Login berhasil! Mengalihkan...", "success");
                setTimeout(() => {
                    window.location.href = "/admin";
                }, 500);
            } else {
                const errorMessage = typeof data.error === "string" ? data.error : "Gagal login, periksa kembali data Anda.";
                showAlert(true, errorMessage, "error");
            }
        } catch (err) {
            showAlert(true, "Gagal terhubung ke server setelah beberapa kali percobaan. Periksa koneksi Anda.", "error");
        } finally {
            resetButtonState(submitBtn, btnIconLogin, btnIconSpinner, btnText);
        }
    }

    function resetButtonState(submitBtn, iconLogin, iconSpinner, btnText) {
        submitBtn.disabled = false;
        iconSpinner.classList.add("hidden");
        iconLogin.classList.remove("hidden");
        btnText.textContent = "Masuk";
    }

    function showAlert(show, message = "", type = "error") {
        const box = document.getElementById("alertBox");
        const icon = document.getElementById("alertIcon");
        const msg = document.getElementById("alertMessage");

        if (!show) {
            box.classList.add("hidden");
            box.classList.remove("flex");
            return;
        }

        box.className = "p-3.5 rounded-2xl border-2 text-xs font-bold flex items-center gap-2 ";
        if (type === "success") {
            box.classList.add("bg-emerald-100", "border-emerald-400", "text-emerald-950");
            icon.className = "fa-solid fa-circle-check text-emerald-700 text-base";
        } else {
            box.classList.add("bg-rose-100", "border-rose-400", "text-rose-950");
            icon.className = "fa-solid fa-triangle-exclamation text-rose-600 text-base";
        }

        msg.textContent = message;
        box.classList.remove("hidden");
    }
</script>
</body>
</html>
