<!DOCTYPE html>
<html lang="id" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preview & Download Data - GoJadwal</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SheetJS (Library Excel Export) -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body class="h-full bg-slate-100 text-slate-900 font-sans antialiased">

    <div class="max-w-6xl mx-auto p-4 sm:p-6 space-y-6">
        
        <!-- HEADER PAGE -->
        <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 bg-white p-6 rounded-3xl border-2 border-emerald-500 shadow-xl">
            <div>
                <a href="/admin" class="inline-flex items-center gap-1.5 text-xs font-bold text-slate-500 hover:text-emerald-700 transition mb-2">
                    <i class="fa-solid fa-arrow-left"></i> Kembali ke Dashboard
                </a>
                <h1 class="text-2xl font-black text-slate-900 flex items-center gap-2">
                    <i class="fa-solid fa-file-excel text-emerald-600"></i> Download Data Jadwal
                </h1>
                <p class="text-xs text-slate-600 font-medium mt-0.5">Preview data jadwal Anda sebelum diunduh ke format Excel (.xlsx)</p>
            </div>

            <!-- TOMBOL DOWNLOAD EXCEL -->
            <button onclick="exportToExcel()" id="downloadBtn" 
                class="w-full sm:w-auto px-5 py-3 bg-emerald-700 hover:bg-emerald-800 disabled:opacity-50 text-white font-black text-xs sm:text-sm rounded-xl shadow-md transition transform active:scale-95 flex items-center justify-center gap-2">
                <i class="fa-solid fa-download"></i> Download ke Excel
            </button>
        </div>

        <!-- PANEL FILTER PREVIEW -->
        <div class="bg-white p-4 sm:p-5 rounded-2xl border-2 border-slate-200 shadow-md flex flex-wrap items-center justify-between gap-4">
            <div class="flex flex-wrap items-center gap-3 w-full sm:w-auto">
                <div class="flex items-center gap-2">
                    <label class="text-xs font-bold text-slate-600 uppercase">Status:</label>
                    <select id="filterStatus" onchange="applyFilter()" class="bg-slate-50 border-2 border-slate-300 rounded-xl px-3 py-1.5 text-xs font-bold text-slate-800 outline-none focus:border-emerald-600">
                        <option value="ALL">Semua Status</option>
                        <option value="CONFIRMED">Disetujui</option>
                        <option value="PENDING">Pending</option>
                    </select>
                </div>
            </div>

            <div class="text-xs font-bold text-slate-500">
                Total Data: <span id="totalRecords" class="text-emerald-700 font-black">0</span> Jadwal
            </div>
        </div>

        <!-- TABEL PREVIEW -->
        <div class="bg-white rounded-3xl border-2 border-emerald-400 shadow-2xl overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-emerald-700 text-white text-xs uppercase font-black tracking-wider">
                            <th class="p-4 w-12 text-center">No</th>
                            <th class="p-4">Tanggal</th>
                            <th class="p-4">Waktu (WOB)</th>
                            <th class="p-4">Status</th>
                            <th class="p-4">Keterangan / Catatan</th>
                        </tr>
                    </thead>
                    <tbody id="previewTableBody" class="divide-y-2 divide-slate-100 text-xs font-semibold text-slate-800">
                        <tr>
                            <td colspan="5" class="p-8 text-center text-slate-400 font-bold">
                                <i class="fa-solid fa-spinner animate-spin text-xl mb-2"></i>
                                <p>Memuat data jadwal...</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        let rawSchedules = [];
        let filteredSchedules = [];
        let loggedInUsername = "";

        document.addEventListener("DOMContentLoaded", () => {
            fetchData();
        });

        // 1. AMBIL DATA DARI BACKEND GO
        async function fetchData() {
            try {
                const response = await fetch('/user', {
                    method: 'GET',
                    headers: { 'Cache-Control': 'no-cache' }
                });

                if (response.status === 401 || response.status === 403) {
                    window.location.replace('/login');
                    return;
                }

                const result = await response.json();
                
                if (result.status === 'success') {
                    loggedInUsername = result.username || "Owner";
                    rawSchedules = result.data || [];
                    filteredSchedules = [...rawSchedules];
                    renderTable();
                } else {
                    showError("Gagal mengambil data dari server.");
                }
            } catch (err) {
                console.error("Fetch error:", err);
                showError("Gagal terhubung ke server.");
            }
        }

        // 2. RENDER DATA KE TABEL PREVIEW (AMAN DARI XSS)
        function renderTable() {
            const tbody = document.getElementById("previewTableBody");
            document.getElementById("totalRecords").textContent = filteredSchedules.length;

            if (filteredSchedules.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="5" class="p-8 text-center text-slate-400 font-bold">
                            Tidak ada data jadwal yang ditemukan.
                        </td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = ""; // Bersihkan isi tabel

            filteredSchedules.forEach((item, index) => {
                const tr = document.createElement("tr");
                tr.className = "hover:bg-slate-50 transition";

                // Badges Status
                const isConfirmed = item.is_confirmed;
                const statusBadge = isConfirmed 
                    ? `<span class="px-2.5 py-1 bg-emerald-100 text-emerald-950 border border-emerald-400 rounded-full font-black text-[10px]">Disetujui</span>`
                    : `<span class="px-2.5 py-1 bg-amber-100 text-amber-950 border border-amber-400 rounded-full font-black text-[10px]">Pending</span>`;

                const jamMulai = item.jam_mulai ? item.jam_mulai.slice(0, 5) : "-";
                const jamSelesai = item.jam_selesai ? item.jam_selesai.slice(0, 5) : "-";

                tr.innerHTML = `
                    <td class="p-4 text-center font-black text-slate-500">${index + 1}</td>
                    <td class="p-4 font-bold text-slate-900">${item.tanggal || '-'}</td>
                    <td class="p-4"><i class="fa-regular fa-clock text-emerald-700 mr-1"></i> ${jamMulai} - ${jamSelesai}</td>
                    <td class="p-4">${statusBadge}</td>
                    <td class="p-4 whitespace-pre-wrap leading-relaxed max-w-xs text-slate-600"></td>
                `;

                // Pengisian keterangan menggunakan textContent aman XSS
                tr.children[4].textContent = item.keterangan || "-";
                tbody.appendChild(tr);
            });
        }

        // 3. FILTER DATA
        function applyFilter() {
            const statusVal = document.getElementById("filterStatus").value;

            filteredSchedules = rawSchedules.filter(item => {
                if (statusVal === "CONFIRMED") return item.is_confirmed;
                if (statusVal === "PENDING") return !item.is_confirmed;
                return true;
            });

            renderTable();
        }

        // 4. EXPORT PREVIEW TABEL KE EXCEL
        function exportToExcel() {
            if (filteredSchedules.length === 0) {
                alert("Tidak ada data untuk diunduh!");
                return;
            }

            const excelData = filteredSchedules.map((item, index) => ({
                "No": index + 1,
                "Tanggal": item.tanggal || "-",
                "Jam Mulai": item.jam_mulai ? item.jam_mulai.slice(0, 5) : "-",
                "Jam Selesai": item.jam_selesai ? item.jam_selesai.slice(0, 5) : "-",
                "Status": item.is_confirmed ? "Disetujui" : "Pending",
                "Keterangan / Catatan": item.keterangan || "-"
            }));

            const worksheet = XLSX.utils.json_to_sheet(excelData);

            // Atur lebar kolom
            worksheet['!cols'] = [
                { wch: 6 },
                { wch: 15 },
                { wch: 12 },
                { wch: 12 },
                { wch: 12 },
                { wch: 45 }
            ];

            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Jadwal Booking");

            const dateStr = new Date().toISOString().slice(0, 10);
            XLSX.writeFile(workbook, `Data_Jadwal_${loggedInUsername}_${dateStr}.xlsx`);
        }

        function showError(msg) {
            const tbody = document.getElementById("previewTableBody");
            tbody.innerHTML = `
                <tr>
                    <td colspan="5" class="p-8 text-center text-rose-600 font-bold">
                        <i class="fa-solid fa-circle-exclamation text-xl mb-2"></i>
                        <p>${msg}</p>
                    </td>
                </tr>
            `;
        }
    </script>
</body>
</html>
