<!DOCTYPE html>
<html lang="id" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pengaturan Akun - GoJadwal</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="h-full bg-slate-100 text-slate-900 font-sans antialiased overflow-y-auto">

    <div class="max-w-2xl mx-auto p-4 sm:p-6 space-y-6">
        
        <!-- HEADER KEMBALI KE ADMIN -->
        <div class="flex items-center justify-between">
            <a href="/admin" class="inline-flex items-center gap-2 px-4 py-2 bg-white border-2 border-emerald-500 text-emerald-800 text-xs font-black rounded-xl hover:bg-emerald-50 transition shadow-sm">
                <i class="fa-solid fa-arrow-left"></i> Kembali ke Dashboard
            </a>
            <h1 class="text-xl font-black text-slate-900">Pengaturan Akun</h1>
        </div>

        <!-- ALERT NOTIFIKASI SINKRON -->
        <div id="notif" class="hidden p-4 rounded-2xl border-2 text-xs sm:text-sm font-bold flex items-center justify-between shadow-sm transition-all">
            <div class="flex items-center gap-2.5" id="notifContent"></div>
            <button onclick="hideNotif()" class="text-slate-500 hover:text-slate-900">
                <i class="fa-solid fa-xmark text-base"></i>
            </button>
        </div>

        <!-- FORM 1: GANTI USERNAME -->
        <div class="bg-white rounded-3xl border-2 border-slate-300 shadow-lg p-6 space-y-4">
            <div class="border-b pb-3">
                <h2 class="text-base font-black text-slate-900 flex items-center gap-2">
                    <i class="fa-solid fa-user-pen text-emerald-600"></i> Ganti Username
                </h2>
                <p class="text-xs text-slate-500 mt-0.5">Username akan mengganti URL unik booking online dan username saat Anda mau Login.</p>
            </div>

            <form onsubmit="handleUpdateUsername(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-extrabold text-slate-700 uppercase mb-1">Username Baru</label>
                    <input type="text" id="usernameBaru" required minlength="3" maxlength="50" placeholder="Masukkan username baru..." 
                        class="w-full bg-slate-50 border-2 border-slate-300 rounded-xl px-4 py-2.5 text-xs font-bold text-slate-900 focus:border-emerald-600 focus:bg-white outline-none transition">
                </div>
                
                <button type="submit" id="btnSubmitUsername" class="px-5 py-2.5 bg-emerald-700 hover:bg-emerald-800 disabled:bg-slate-400 text-white text-xs font-black rounded-xl transition shadow-md active:scale-95 flex items-center gap-2">
                    <span id="btnTextUsername">Simpan Username</span>
                </button>
            </form>
        </div>

        <!-- FORM 2: GANTI PASSWORD -->
        <div class="bg-white rounded-3xl border-2 border-slate-300 shadow-lg p-6 space-y-4">
            <div class="border-b pb-3">
                <h2 class="text-base font-black text-slate-900 flex items-center gap-2">
                    <i class="fa-solid fa-lock text-emerald-600"></i> Ganti Password
                </h2>
                <p class="text-xs text-slate-500 mt-0.5">Pastikan password baru Anda minimal 6 karakter.</p>
            </div>

            <form onsubmit="handleUpdatePassword(event)" class="space-y-4">
                <!-- Input Password Saat Ini -->
                <div>
                    <label class="block text-xs font-extrabold text-slate-700 uppercase mb-1">Password Saat Ini</label>
                    <div class="relative">
                        <input type="password" id="passwordLama" required placeholder="••••••••" 
                            class="w-full bg-slate-50 border-2 border-slate-300 rounded-xl pl-4 pr-10 py-2.5 text-xs font-bold text-slate-900 focus:border-emerald-600 focus:bg-white outline-none transition">
                        <button type="button" onclick="togglePasswordVisibility('passwordLama', 'iconPassLama')" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-700 p-1">
                            <i class="fa-solid fa-eye" id="iconPassLama"></i>
                        </button>
                    </div>
                </div>

                <!-- Input Password Baru -->
                <div>
                    <label class="block text-xs font-extrabold text-slate-700 uppercase mb-1">Password Baru</label>
                    <div class="relative">
                        <input type="password" id="passwordBaru" required minlength="6" placeholder="••••••••" 
                            class="w-full bg-slate-50 border-2 border-slate-300 rounded-xl pl-4 pr-10 py-2.5 text-xs font-bold text-slate-900 focus:border-emerald-600 focus:bg-white outline-none transition">
                        <button type="button" onclick="togglePasswordVisibility('passwordBaru', 'iconPassBaru')" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-700 p-1">
                            <i class="fa-solid fa-eye" id="iconPassBaru"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" id="btnSubmitPassword" class="px-5 py-2.5 bg-slate-800 hover:bg-slate-900 disabled:bg-slate-400 text-white text-xs font-black rounded-xl transition shadow-md active:scale-95 flex items-center gap-2">
                    <span id="btnTextPassword">Perbarui Password</span>
                </button>
            </form>
        </div>

    </div>

    <!-- JAVASCRIPT SYSTEM LOGIC FOR SETTINGS -->
    <script>
        // FUNGSI RETRY OTOMATIS (SINKRON DENGAN DASHBOARD ADMIN)
        async function fetchWithRetry(url, options = {}, retries = 3, delay = 300) {
            try {
                const response = await fetch(url, options);
                if (response.status >= 500 && retries > 0) {
                    await new Promise(r => setTimeout(r, delay));
                    return fetchWithRetry(url, options, retries - 1, delay * 2);
                }
                return response;
            } catch (err) {
                if (retries > 0) {
                    await new Promise(r => setTimeout(r, delay));
                    return fetchWithRetry(url, options, retries - 1, delay * 2);
                }
                throw err;
            }
        }

        // FUNGSI TOGGLE LIHAT / SEMBUNYIKAN PASSWORD
        function togglePasswordVisibility(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);

            if (input.type === "password") {
                input.type = "text";
                icon.classList.remove("fa-eye");
                icon.classList.add("fa-eye-slash");
            } else {
                input.type = "password";
                icon.classList.remove("fa-eye-slash");
                icon.classList.add("fa-eye");
            }
        }

        // NOTIFIKASI AMAN DARI XSS
        function showNotif(msg, isSuccess) {
            const el = document.getElementById('notif');
            const content = document.getElementById('notifContent');

            el.className = `p-4 rounded-2xl border-2 text-xs sm:text-sm font-bold flex items-center justify-between ${
                isSuccess ? 'bg-emerald-100 border-emerald-400 text-emerald-950' : 'bg-rose-100 border-rose-400 text-rose-950'
            }`;

            const icon = document.createElement('i');
            const textSpan = document.createElement('span');
            textSpan.textContent = msg;

            if (isSuccess) {
                icon.className = 'fa-solid fa-circle-check text-emerald-700 text-lg';
            } else {
                icon.className = 'fa-solid fa-triangle-exclamation text-rose-600 text-lg';
            }

            content.replaceChildren(icon, textSpan);
            el.classList.remove('hidden');
        }

        function hideNotif() {
            document.getElementById('notif').classList.add('hidden');
        }

        // HANDLE UPDATE USERNAME DENGAN DIALOG KONFIRMASI & LOADING
        async function handleUpdateUsername(e) {
            e.preventDefault();
            const username = document.getElementById('usernameBaru').value.trim();

            if (!username) return;

            // Dialog Konfirmasi (Ya / Batal)
            const yakin = confirm(`Apakah Anda yakin ingin mengubah username menjadi "${username}"?\n\nCatatan: URL link booking online Anda juga akan berubah.`);
            if (!yakin) return;

            const btn = document.getElementById('btnSubmitUsername');
            const btnText = document.getElementById('btnTextUsername');

            // Set UI ke State Loading
            btn.disabled = true;
            btnText.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> Menyimpan...`;

            try {
                const res = await fetchWithRetry('/user/change-username', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username_baru: username })
                });

                const data = await res.json();

                if (res.ok) {
                    showNotif("Username berhasil diubah!", true);
                    document.getElementById('usernameBaru').value = '';
                } else {
                    showNotif(data.err || "Gagal mengubah username.", false);
                }
            } catch (err) {
                showNotif("Gagal menghubungi server. Silakan coba lagi.", false);
            } finally {
                // Kembalikan Tombol ke Normal
                btn.disabled = false;
                btnText.innerText = "Simpan Username";
            }
        }

        // HANDLE UPDATE PASSWORD DENGAN DIALOG KONFIRMASI & LOADING
        async function handleUpdatePassword(e) {
            e.preventDefault();
            const passLama = document.getElementById('passwordLama').value;
            const passBaru = document.getElementById('passwordBaru').value;

            if (!passLama || !passBaru) return;

            // Dialog Konfirmasi (Ya / Batal)
            const yakin = confirm("Apakah Anda yakin ingin memperbarui password akun Anda?");
            if (!yakin) return;

            const btn = document.getElementById('btnSubmitPassword');
            const btnText = document.getElementById('btnTextPassword');

            // Set UI ke State Loading
            btn.disabled = true;
            btnText.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> Memproses...`;

            try {
                const res = await fetchWithRetry('/user/change-password', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        password_lama: passLama,
                        password_baru: passBaru
                    })
                });

                const data = await res.json();

                if (res.ok) {
                    showNotif("Password berhasil diperbarui!", true);
                    document.getElementById('passwordLama').value = '';
                    document.getElementById('passwordBaru').value = '';
                } else {
                    showNotif(data.err || "Gagal memperbarui password.", false);
                }
            } catch (err) {
                showNotif("Gagal menghubungi server. Silakan coba lagi.", false);
            } finally {
                // Kembalikan Tombol ke Normal
                btn.disabled = false;
                btnText.innerText = "Perbarui Password";
            }
        }
    </script>
</body>
</html>
